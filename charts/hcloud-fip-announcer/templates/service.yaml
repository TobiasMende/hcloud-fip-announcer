apiVersion: v1
kind: Service
metadata:
  name: {{ include "fip.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fip.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "fip.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
