{{- if and .Values.hcloud.token (not .Values.hcloud.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fip.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fip.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.hcloud.existingSecretKey }}: {{ .Values.hcloud.token | quote }}
{{- end }}
