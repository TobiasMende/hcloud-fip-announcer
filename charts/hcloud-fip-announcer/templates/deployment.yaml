{{- $clusterId := required "clusterId is required" .Values.clusterId -}}
{{- if not (or .Values.hcloud.token .Values.hcloud.existingSecret) }}
{{- fail "set hcloud.token or hcloud.existingSecret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fip.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fip.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fip.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fip.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "fip.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --cluster-id={{ $clusterId }}
            - --load-balancer-class={{ .Values.controller.loadBalancerClass }}
            - --anti-flap={{ .Values.controller.antiFlap }}
            - --hetzner-poll-interval={{ .Values.controller.hetznerPollInterval }}
            - --max-concurrent-reconciles={{ .Values.controller.maxConcurrentReconciles }}
            - --probe-interval={{ .Values.controller.probeInterval }}
            - --probe-failure-threshold={{ .Values.controller.probeFailureThreshold }}
            - --leader-elect
            - --leader-elect-lease-duration={{ .Values.controller.leaderElection.leaseDuration }}
            - --leader-elect-renew-deadline={{ .Values.controller.leaderElection.renewDeadline }}
            - --leader-elect-retry-period={{ .Values.controller.leaderElection.retryPeriod }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            - --health-probe-bind-address=:{{ .Values.healthProbePort }}
            {{- range .Values.controller.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "fip.secretName" . }}
                  key: {{ .Values.hcloud.existingSecretKey }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.healthProbePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "fip.selectorLabels" . | nindent 20 }}
        {{- end }}
