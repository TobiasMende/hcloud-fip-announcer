name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  IMAGE: ghcr.io/tobiasmende/hcloud-fip-announcer
  CHARTS: oci://ghcr.io/tobiasmende/charts

jobs:
  release:
    name: Image, chart, release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          provenance: false

      - name: Sign image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to image
        run: |
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Package and push chart
        run: |
          helm package charts/hcloud-fip-announcer --version "$VERSION" --app-version "$VERSION" --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/hcloud-fip-announcer-${VERSION}.tgz" "$CHARTS" 2>&1 | tee push.log
          CHART_DIGEST=$(sed -n 's/^Digest: //p' push.log)
          cosign sign --yes "ghcr.io/tobiasmende/charts/hcloud-fip-announcer@${CHART_DIGEST}"

      - name: GitHub release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--generate-notes)
            [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" sbom.spdx.json "dist/hcloud-fip-announcer-${VERSION}.tgz" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
