---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups/finalizers
  verbs:
  - update
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups/status
  verbs:
  - get
  - patch
  - update
