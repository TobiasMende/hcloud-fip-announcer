# This rule is not used by the project hcloud-fip-announcer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over fip-announcer.inocea.de.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hcloud-fip-announcer
    app.kubernetes.io/managed-by: kustomize
  name: floatingipgroup-admin-role
rules:
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups
  verbs:
  - '*'
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups/status
  verbs:
  - get
