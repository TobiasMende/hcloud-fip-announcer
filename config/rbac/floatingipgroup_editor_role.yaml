# This rule is not used by the project hcloud-fip-announcer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the fip-announcer.inocea.de.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hcloud-fip-announcer
    app.kubernetes.io/managed-by: kustomize
  name: floatingipgroup-editor-role
rules:
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fip-announcer.inocea.de
  resources:
  - floatingipgroups/status
  verbs:
  - get
